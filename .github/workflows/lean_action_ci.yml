name: Lean proofs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-proofs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  comparator:
    name: Comparator (${{ matrix.project }})
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        project: [bound-184, bound-195]
    env:
      LEAN_NUM_THREADS: "2"
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Cache project dependencies and compiled proofs
        uses: actions/cache@v5
        with:
          path: ${{ matrix.project }}/.lake
          key: proof-${{ runner.os }}-${{ runner.arch }}-${{ matrix.project }}-${{ hashFiles('**/lean-toolchain', '**/lake-manifest.json', '**/lakefile.toml', 'scripts/*.py') }}-${{ github.sha }}
          restore-keys: proof-${{ runner.os }}-${{ runner.arch }}-${{ matrix.project }}-${{ hashFiles('**/lean-toolchain', '**/lake-manifest.json', '**/lakefile.toml', 'scripts/*.py') }}-
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: ${{ matrix.project }}
          build: "false"
          test: "false"
          lint: "false"
          use-mathlib-cache: "true"
          use-github-cache: "false"
      - name: Check out Comparator for Lean 4.30
        uses: actions/checkout@v5
        with:
          repository: leanprover/comparator
          ref: 0ff36dde148dfea82dbdcf3baf91d6e1a8195554
          path: .lake/comparator
      - name: Check out the matching exporter
        uses: actions/checkout@v5
        with:
          repository: leanprover/lean4export
          ref: fb517af7d71065b28c256348afdf764308acc369
          path: .lake/lean4export
      - name: Build Comparator
        working-directory: .lake/comparator
        run: lake build comparator
      - name: Build exporter
        working-directory: .lake/lean4export
        run: lake build lean4export
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false
      - name: Install Landrun
        run: go install github.com/zouuup/landrun/cmd/landrun@811cfff51ceaf3d9843708aa6d22e9b84ccac8b4
      - name: Add verification tools to PATH
        run: |
          echo "$GITHUB_WORKSPACE/.lake/comparator/.lake/build/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/.lake/lean4export/.lake/build/bin" >> "$GITHUB_PATH"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build and verify with Comparator
        # The service executes as the runner user, with AF_UNIX disabled.
        run: |
          sudo systemd-run --uid="$(id -u)" --gid="$(id -g)" \
            --wait --pipe --collect \
            --property=RestrictAddressFamilies=~AF_UNIX \
            --setenv="PATH=$PATH" --setenv="HOME=$HOME" \
            --setenv=LEAN_NUM_THREADS=2 --working-directory="$PWD" \
            "$(command -v lake)" test
