name = "k-median-184"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["KMedian184", "Challenge", "Solution"]
testDriver = "comparator_test"

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.0-rc2"

[[lean_lib]]
name = "KMedian184"

[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"

[[lean_exe]]
name = "comparator_test"
root = "ComparatorTest"
