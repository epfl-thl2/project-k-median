version: "v0.4"

project:
  name: "A 1.95 Factor-Revealing Bound for k-Median"
  description: >-
    Lean 4 and Mathlib formalization of an upper bound for the factor-revealing
    program associated with the bid beta(alpha, d) = max(alpha - 1.224 d, 0).
    For every program size n >= 1, the principal theorem proves the exact bound
    2 - (1.224 - 1)^2 = 1.949824, with 1.95 as a convenient corollary.
  authors:
    - "Rares Buhai"
  responsible_maintainers:
    - "Rares Buhai"
  license: "TODO: add an SPDX license identifier; no LICENSE file is currently present"

sources:
  - title: "The Power of General Bids for k-Median"
    authors:
      - "TODO: add the manuscript authors"
    id: "TODO: add a public manuscript URL, DOI, or arXiv identifier"
    type: "manuscript"
    location: >-
      Definition `def:frp` and Theorem `thm:1.95-frp` in
      `Paper/paper-source/approximation-guarantee.tex`
    relationship: "formalizes"
    note: >-
      The source copy used for the formalization is retained in Git commit
      7342c750ba1a364863f70fcdc2d22e418c1b5269 at `Paper/paper.pdf`.

classification:
  arxiv: ["cs.DS"]
  msc2020: ["68W25", "90C27"]

status:
  scope: >-
    Formalizes the gamma = 153/125 endpoint of the source's factor-revealing
    upper bound for every n >= 1. It does not formalize the rest of the
    manuscript or the downstream facility-location and k-median algorithms.
    The two `sorry` declarations in `Challenge.lean` are deliberate Comparator
    statement placeholders and are excluded from the counts below.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
  main_results:
    - declaration: "Formalization195.originalPrimalUpperBound_153_div_125_exact"
      file: "Formalization195/FactorRevealingPrimal.lean"
      sorry_count: 0
      axioms:
        - "propext"
        - "Classical.choice"
        - "Quot.sound"
      comparator_config: "config.json"
    - declaration: "Formalization195.originalPrimalUpperBound_195"
      file: "Formalization195/FactorRevealingPrimal.lean"
      sorry_count: 0
      axioms:
        - "propext"
        - "Classical.choice"
        - "Quot.sound"
      comparator_config: "config.json"

