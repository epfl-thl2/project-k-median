fidelity:
  divergences: >-
    The source theorem treats every gamma in [1, 1.224], while the public Lean
    results specialize to gamma = 1.224. The Lean development proves the
    factor-revealing-program bound itself, not the paper's downstream
    algorithmic consequences. At that endpoint, the exact Lean bound 1.949824
    is slightly stronger than the rounded 1.95 result.

review:
  # TODO: update this status if mathematical or source-faithfulness review exists.
  status: "unchecked"
  reviewers: []
  notes: >-
    No external mathematical or source-to-Lean statement review is documented.
    The proof development is sorry-free, and `config.json` configures
    leanprover/comparator to compare both main declarations with the
    self-contained statements in `Challenge.lean` using only the listed axioms.

alignment:
  namespace: "Formalization195"
  statements:
    - source: >-
        Factor-revealing upper bound at gamma = 1.224 (Definition `def:frp` and
        Theorem `thm:1.95-frp`)
      lean: "Formalization195.originalPrimalUpperBound_153_div_125_exact"
      module: "Formalization195.FactorRevealingPrimal"
      status: "proved"
      note: "Proves the exact bound 2 - (153/125 - 1)^2 = 1.949824."
    - source: "Rounded 1.95 factor-revealing upper bound at gamma = 1.224"
      lean: "Formalization195.originalPrimalUpperBound_195"
      module: "Formalization195.FactorRevealingPrimal"
      status: "proved"
      note: "Derives the advertised bound 39/20 = 1.95 from the exact result."

acknowledgements: >-
  Built with Lean 4 and Mathlib. The main results can be checked against their
  trusted statement surface with leanprover/comparator.
