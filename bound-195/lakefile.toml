name = "k-median-195"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Formalization195", "Challenge", "Solution"]
testDriver = "comparator_test"
weakLeanArgs = ["-j2"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.30.0-rc1"

[[lean_lib]]
name = "Formalization195"

[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"

[[lean_exe]]
name = "comparator_test"
root = "ComparatorTest"
